name: Publish to npm

# A release tag `<mod>-v<version>` (for example `waypoints-v2.8.0`) publishes that
# mod as @afterever/<mod>@<version>. The marketplace still installs from the
# relative ./<mod> paths, so a failed publish never blocks a release; run this
# workflow again from the Actions tab (workflow_dispatch) to retry one.
#
# No npm token is stored anywhere: each package lists this workflow file as a
# trusted publisher (npmjs.com > the package > Settings > Trusted publisher:
# user afterever, repository claude-craftkits, workflow publish-npm.yml), and
# npm accepts the run's GitHub identity (the id-token permission below) instead.
# Provenance is attached automatically. The workflow filename is part of that
# trust, so renaming this file means updating all seven packages' settings.
#
# The last step also publishes the package to GitHub Packages, which is what
# fills the "Packages" box on the repository homepage.
on:
  push:
    tags:
      - '*-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example waypoints-v2.8.0'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: publish ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # how npm recognises this run as the trusted publisher
      packages: write # lets GITHUB_TOKEN publish to GitHub Packages (see last step)
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Two checkouts: the scripts come from the commit this workflow runs at, and
      # the mod's files come from the tag. A tag made before a script existed (or
      # before it was fixed) can then still be published, and nothing from the
      # tag is ever run, only copied into the package.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          path: release
      # Trusted publishing needs Node 22.14+ and npm 11.5.1+. There is no
      # registry-url here on purpose: setup-node would write an .npmrc that
      # demands a NODE_AUTH_TOKEN, which no longer exists.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check npm is new enough for trusted publishing
        run: |
          node -v
          npm -v
          node -e "const [a,b,c]=process.versions.node.split('.').map(Number);if(a<22||(a===22&&b<14)){console.error('::error::Node 22.14+ is needed');process.exit(1)}"
          node -e "const [a,b,c]=require('child_process').execSync('npm -v').toString().trim().split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('::error::npm 11.5.1+ is needed');process.exit(1)}"

      - name: Read the mod and version from the tag
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^([a-z][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag '$TAG' is not <mod>-v<x.y.z>"
            exit 1
          fi
          echo "mod=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Check the tag against the manifest
        env:
          MOD: ${{ steps.tag.outputs.mod }}
          VERSION: ${{ steps.tag.outputs.version }}
        working-directory: release
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/check-versions.mjs"
          declared=$(node -p "require('./$MOD/.claude-plugin/plugin.json').version")
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag says $VERSION but $MOD/.claude-plugin/plugin.json says $declared"
            exit 1
          fi

      - name: Build the package
        env:
          MOD: ${{ steps.tag.outputs.mod }}
        working-directory: release
        run: node "$GITHUB_WORKSPACE/.github/scripts/build-npm-package.mjs" "$MOD" "$RUNNER_TEMP/package"

      - name: Publish
        env:
          MOD: ${{ steps.tag.outputs.mod }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if npm view "@afterever/$MOD@$VERSION" version >/dev/null 2>&1; then
            echo "@afterever/$MOD@$VERSION is already on npm; nothing to publish"
            exit 0
          fi
          cd "$RUNNER_TEMP/package"
          npm publish --access public

      # The same package, again on GitHub Packages, so it is listed in the
      # "Packages" box on the repository homepage. That registry wants a login
      # even to install, so npmjs.com stays the way people install; this copy is
      # there for the listing. The @afterever scope matches the account that owns
      # the repository, which GitHub requires. Trusted publishing is npmjs.com
      # only, so this step uses the run's GITHUB_TOKEN, and provenance is off
      # because GitHub's registry does not take npm's.
      - name: Publish to GitHub Packages
        env:
          MOD: ${{ steps.tag.outputs.mod }}
          VERSION: ${{ steps.tag.outputs.version }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry=https://npm.pkg.github.com
          npmrc="$RUNNER_TEMP/github-packages.npmrc"
          printf '%s\n' "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" > "$npmrc"
          if npm view "@afterever/$MOD@$VERSION" version --registry "$registry" --userconfig "$npmrc" >/dev/null 2>&1; then
            echo "@afterever/$MOD@$VERSION is already on GitHub Packages; nothing to publish"
            exit 0
          fi
          cd "$RUNNER_TEMP/package"
          npm publish --access public --registry "$registry" --userconfig "$npmrc" --provenance=false
