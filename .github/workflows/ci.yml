name: CI

# Runs on every pull request, markdown-only ones too: these jobs are required
# checks on master, and a skipped workflow would leave them pending forever.
# Prose-only changes that go straight to master never trigger it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The version the mods are developed against. Bump it with the mods.
  CLAUDE_CODE_VERSION: 2.1.303

jobs:
  validate:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-versions.mjs
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - run: claude plugin validate . --strict
      # Every mod must still stage and pack as an npm package (publish-npm.yml
      # does this for real on a release tag), so a break shows up here first.
      - name: Dry-run the npm packages
        run: |
          for mod in */.claude-plugin/plugin.json; do
            mod=${mod%%/*}
            node .github/scripts/build-npm-package.mjs "$mod" "$RUNNER_TEMP/npm/$mod"
            (cd "$RUNNER_TEMP/npm/$mod" && npm publish --dry-run --provenance=false --access public)
          done

  test:
    name: test ${{ matrix.mod }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        mod:
          - agent-pulse
          - arsenal
          - ctx
          - prompt-upgrade
          - subagent-progress
          - waypoints
          - work-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - run: claude plugin test ${{ matrix.mod }}
